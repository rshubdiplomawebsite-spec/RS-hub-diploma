<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PECE Notes | RS Hub Diploma</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --blue:#1a56ff;
    --purple:#7c3aed;
    --gold:#f59e0b;
    --dark:#0a0a1a;
    --darker:#050510;
    --white:#ffffff;
    --gray:#a0aec0;
    --card-bg:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'DM Sans',sans-serif;
    background:var(--darker);
    color:white;
    overflow:hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* BACKGROUND EFFECT */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;
    z-index:9999;
    opacity:0.4;
}

/* BLOBS */

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:0.25;
}

.blob1{
    width:400px;
    height:400px;
    background:var(--blue);
    top:-120px;
    left:-120px;
}

.blob2{
    width:350px;
    height:350px;
    background:var(--purple);
    right:-100px;
    bottom:-100px;
}

/* CARD */

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:650px;
    background:var(--card-bg);
    border:1px solid var(--border);
    backdrop-filter:blur(14px);
    border-radius:32px;
    padding:55px 35px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

/* BADGE */

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(245,158,11,0.12);
    border:1px solid rgba(245,158,11,0.3);
    color:var(--gold);
    padding:7px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    margin-bottom:24px;
}

/* HEADING */

h1{
    font-family:'Syne',sans-serif;
    font-size:clamp(40px,6vw,68px);
    line-height:1.1;
    margin-bottom:18px;
    font-weight:800;
    letter-spacing:-2px;
}

h1 span{
    background:linear-gradient(135deg,var(--blue),var(--purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    color:var(--gray);
    font-size:18px;
    line-height:1.8;
    margin-bottom:16px;
}

/* COMING */

.coming{
    margin:30px auto;
    display:inline-block;
    background:linear-gradient(135deg,rgba(26,86,255,0.15),rgba(124,58,237,0.15));
    border:1px solid rgba(255,255,255,0.08);
    padding:18px 28px;
    border-radius:18px;
    font-size:22px;
    font-weight:700;
}

/* BUTTON */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:20px;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    color:white;
    text-decoration:none;
    padding:16px 30px;
    border-radius:16px;
    font-size:17px;
    font-weight:700;
    transition:0.35s;
    box-shadow:0 12px 40px rgba(26,86,255,0.25);
}

.btn:hover{
    transform:translateY(-5px);
    box-shadow:0 20px 50px rgba(26,86,255,0.35);
}

/* MOBILE */

@media(max-width:768px){

    .container{
        padding:40px 22px;
    }

    p{
        font-size:16px;
    }

    .coming{
        font-size:18px;
        padding:16px 22px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="container">

<div class="badge">📚 RS Hub Diploma Resources</div>

<h1>
PECE <br>
<span>Notes</span>
</h1>

<p>
🚧 Notes and study materials are currently under development.
</p>

<p>
Important PDFs, handwritten notes and preparation resources
will be uploaded soon for students.
</p>

<div class="coming">
🔥 Coming Soon...
</div>

<br>

<a href="/index.html" class="btn">
⬅ Back to Home
</a>

</div>

</body>
</html>
